name: Validate and deploy Descent Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate page structure
        run: python tests/check_page.py
      - name: Check JavaScript and run core tests
        run: npm run check
      - name: Validate Python syntax
        run: python -m py_compile ml/train_lunarlander.py ml/evaluate_lunarlander.py
      - name: Upload static browser app
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: validate
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
